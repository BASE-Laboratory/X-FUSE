name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality Gates & Version Match
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          uv sync --extra cpu --extra io --extra dev --extra docs
          --index-strategy unsafe-best-match
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check tag matches x_fuse.__version__, pyproject.toml & CITATION.cff
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          uv run python -c '
          import importlib.metadata, pathlib, re, sys, x_fuse
          tag = sys.argv[1]
          meta_v = importlib.metadata.version("x-fuse")
          cff_m = re.search(r"^version:\s*(\S+)", pathlib.Path("CITATION.cff").read_text(), re.M)
          cff_v = cff_m.group(1).strip("\"'") if cff_m else ""
          print(f"Tag={tag}, __version__={x_fuse.__version__}, metadata={meta_v}, CITATION.cff={cff_v}")
          assert tag == x_fuse.__version__ == meta_v == cff_v
          ' "${TAG_VER}"

      - name: Run Ruff, Mypy, Docs & Coverage Test Gates
        run: |
          uv run ruff check x_fuse tests benchmarks
          uv run ruff format --check x_fuse tests benchmarks
          uv run mypy x_fuse
          NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict -d /tmp/xfuse-rel-docs
          uv run pytest -m "not gpu" --cov=x_fuse --cov-fail-under=85 -q

  build:
    name: Build Distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test built wheel outside repo
        run: |
          uv venv /tmp/xfuse-rel-wheel
          uv pip install --python /tmp/xfuse-rel-wheel \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            dist/*.whl
          cd /tmp
          /tmp/xfuse-rel-wheel/bin/xfuse --version
          /tmp/xfuse-rel-wheel/bin/xfuse info
          /tmp/xfuse-rel-wheel/bin/xfuse demo --epochs 2

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/x-fuse
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

