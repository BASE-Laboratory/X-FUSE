[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-fuse"
version = "1.0.0"
description = "Physics-guided foundation-model feature fusion and conformal uncertainty quantification for correlative materials imaging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Calum Green", email = "calum.green17@imperial.ac.uk" },
    { name = "James Le Houx" },
    { name = "BASE Laboratory" },
]
maintainers = [
    { name = "James Le Houx" },
]
keywords = [
    "materials-science",
    "correlative-microscopy",
    "tomography",
    "uncertainty-quantification",
    "conformal-prediction",
    "vision-transformer",
    "multimodal-fusion",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Swap to "basecoat>=0.2.0,<0.3.0" once PyPI Trusted Publisher is enabled on BASE-Laboratory/basecoat
    "basecoat @ git+https://github.com/BASE-Laboratory/basecoat.git@v0.2.0",
    "h5py>=3.10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=9.4",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "timm>=0.9.16",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.urls]
Homepage = "https://github.com/BASE-Laboratory/X-FUSE"
Documentation = "https://base-laboratory.github.io/X-FUSE/"
Repository = "https://github.com/BASE-Laboratory/X-FUSE"
Issues = "https://github.com/BASE-Laboratory/X-FUSE/issues"
Changelog = "https://github.com/BASE-Laboratory/X-FUSE/blob/main/CHANGELOG.md"

[project.scripts]
xfuse = "x_fuse.cli:main"

[project.optional-dependencies]
io = [
    "rosettasciio>=0.5",
    "tifffile>=2023.9",
    "zarr>=2.16",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
synthetic = [
    "porespy>=2.4",
]
sam = [
    "sam2>=1.1.0",
]
cuda = [
    "torch>=2.1",
    "xformers>=0.0.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cpu = [
    "torch>=2.1",
]
notebooks = [
    "ipykernel>=6.25",
    "ipywidgets>=8.0",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
]
dev = [
    "mypy>=1.11",
    "nbformat>=5.9",
    "nbstripout>=0.7",
    "porespy>=2.4",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "tifffile>=2023.9",
    "zarr>=2.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["x_fuse"]

[tool.hatch.build.targets.sdist]
include = [
    "/x_fuse",
    "/tests",
    "/benchmarks",
    "/notebooks",
    "/docs",
    "/mkdocs.yml",
    "/AGENTS.md",
    "/ECOSYSTEM.md",
    "/README.md",
    "/INSTALL.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CITATION.cff",
    "/LICENSE",
    "/Makefile",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E203",  # whitespace before ':' (formatter-compatible)
]

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true

[tool.mypy]
files = ["x_fuse"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: marks tests requiring a CUDA-enabled GPU (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["x_fuse"]
branch = false
omit = ["x_fuse/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.basecoat.layers]
layer = 2
source_dirs = ["x_fuse"]
banned_imports = [
    "multimodal_benchmark",
    "openimpala",
    "openlsrx",
    "braggtrack",
    "numcodecs",
]
