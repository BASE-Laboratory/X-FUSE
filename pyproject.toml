[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-fuse"
version = "0.2.0"
description = "Uncertainty-aware foundation-model fusion for 2D & 2.5D correlative materials imaging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Calum Green", email = "calum.green17@imperial.ac.uk" },
    { name = "BASE Laboratory" },
]
keywords = [
    "materials-science",
    "correlative-microscopy",
    "tomography",
    "uncertainty-quantification",
    "vision-transformer",
    "multimodal-fusion",
]
dependencies = [
    "h5py>=3.10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
    "pillow>=9.4",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "timm>=0.9.16",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
synthetic = [
    "porespy>=2.4",
]
sam = [
    "sam2>=1.1.0",
]
cuda = [
    "torch>=2.1",
    "xformers>=0.0.27",
]
cpu = [
    "torch>=2.1",
]
notebooks = [
    "ipykernel>=6.25",
    "jupyter>=1.0",
]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "porespy>=2.4",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["x_fuse"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: marks tests requiring a CUDA-enabled GPU (deselect with '-m not gpu')"]
